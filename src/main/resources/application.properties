# =============================================================
# AGI - Asistente Guía Interactivo
# Configuración de la aplicación Spring Boot
# =============================================================

# --- Aplicación y servidor Tomcat embebido ---
spring.application.name=agi
server.port=8080
server.servlet.context-path=/agi

# --- Datos de acceso a MySQL ---
# Se reutiliza el archivo config/db.properties de la versión anterior
# (claves db.url, db.usuario y db.clave). Ese archivo no se sube a GitHub.
spring.config.import=optional:file:./config/db.properties

spring.datasource.url=${db.url:jdbc:mysql://localhost:3306/agi}
spring.datasource.username=${db.usuario:root}
spring.datasource.password=${db.clave:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# Las tablas las crea el script db/agi_bd.sql; Hibernate no modifica la estructura
spring.jpa.hibernate.ddl-auto=none
# Muestra en la consola las sentencias SQL que genera Hibernate
spring.jpa.show-sql=true
# Mantiene abierta la sesión de JPA mientras se dibuja la vista
spring.jpa.open-in-view=true

# --- Thymeleaf ---
# Sin caché para ver los cambios de las plantillas al recargar la página
spring.thymeleaf.cache=false

# --- Sesión ---
server.servlet.session.timeout=30m
